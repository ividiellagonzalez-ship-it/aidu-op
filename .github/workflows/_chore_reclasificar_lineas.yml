name: '[CHORE] Reclasificar lineas S13.4.2 (TEMPORAL)'

# TEMPORAL - one-shot post-merge de S13.4.2.
# Aplica el clasificador nuevo (6 lineas + Otros, prioridad fija,
# excluyentes) a los 654 items existentes de inteligencia_precios.
#
# Ejecutar 1 vez tras mergear el PR S13.4.2. Idempotente: re-ejecutar
# es no-op si la BD ya esta consistente.
#
# CLEANUP: este workflow y el script scripts/s13_4_2_reclasificar_lineas.py
# se eliminan en un PR aparte tras validacion visual del Director.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reclasificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar migraciones a Turso (defense in depth)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -c "
          from app.db.migrator import run_migrations
          n, applied = run_migrations()
          print(f'Migraciones aplicadas en este run: {n}')
          for m in applied:
              print(f'  - {m}')
          "

      - name: Reclasificar inteligencia_precios contra clasificador v2
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m scripts.s13_4_2_reclasificar_lineas
