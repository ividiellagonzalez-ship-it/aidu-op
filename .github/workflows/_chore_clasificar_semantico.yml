name: '[CHORE] Clasificar semantico S13.4.3 (TEMPORAL)'

# TEMPORAL - one-shot post-merge de S13.4.3.
# Re-clasifica los ~685 items existentes via Claude API.
#
# Costo estimado: ~$1.64 USD (~1900 CLP).
# Rate limit: 5 req/s. Duracion estimada: ~5-7 minutos.
# Tope: si proyeccion supera $5 USD, el script aborta con exit 4.
#
# Permite override del modelo via env var CLAUDE_MODEL_CLASIFICADOR
# (default: claude-sonnet-4-5, validado en produccion).
#
# CLEANUP: este workflow + scripts/s13_4_3_reclasificar_semantico.py se
# eliminan en un PR aparte tras validacion visual del Director.

on:
  workflow_dispatch:
    inputs:
      modelo:
        description: 'Override del modelo Claude (default claude-sonnet-4-5)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  clasificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar migraciones a Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          python -c "
          from app.db.migrator import run_migrations
          n, applied = run_migrations()
          print(f'Migraciones aplicadas: {n}')
          for m in applied:
              print(f'  - {m}')
          "

      - name: Reclasificar inteligencia_precios via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLAUDE_MODEL_CLASIFICADOR: ${{ inputs.modelo }}
        run: python -m scripts.s13_4_3_reclasificar_semantico
